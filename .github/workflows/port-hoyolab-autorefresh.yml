name: Port HoYoLAB Auto Refresh

on:
  push:
    branches:
      - fix/localized-time-units-0.18.0
    paths:
      - '.github/scripts/port_hoyolab_autorefresh_018.py'
      - '.github/workflows/port-hoyolab-autorefresh.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/localized-time-units-0.18.0
          fetch-depth: 2

      - name: Apply migration
        run: python .github/scripts/port_hoyolab_autorefresh_018.py

      - name: Commit migrated sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes are required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Starward src/Starward.Language
          git commit -m "Port HoYoLAB Toolbox auto refresh to 0.18.0"
          git push

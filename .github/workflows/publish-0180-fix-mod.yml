name: Publish Starward 0.18.0 fix mod

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-starward-0.18.0-fix-mod-final
  cancel-in-progress: true

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout exact branch head
      uses: actions/checkout@v5
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Download verified x64 and ARM64 artifacts
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p work/x64 work/arm64 dist

        gh api "/repos/${{ github.repository }}/actions/artifacts/8624278886/zip" > x64-artifact.zip
        gh api "/repos/${{ github.repository }}/actions/artifacts/8624279554/zip" > arm64-artifact.zip

        unzip -q x64-artifact.zip -d work/x64
        unzip -q arm64-artifact.zip -d work/arm64

        (cd work/x64 && zip -qr ../../dist/Starward_0.18.0_fix_mod_x64.zip .)
        (cd work/arm64 && zip -qr ../../dist/Starward_0.18.0_fix_mod_arm64.zip .)

    - name: Prepare bilingual release notes
      shell: bash
      run: |
        cat RELEASE_NOTES_RU.md > RELEASE_NOTES_BILINGUAL.md
        printf '\n\n---\n\n' >> RELEASE_NOTES_BILINGUAL.md
        cat RELEASE_NOTES_EN.md >> RELEASE_NOTES_BILINGUAL.md

    - name: Publish GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        TAG="v0.18.0-fix-mod"
        TITLE="Starward 0.18.0 fix mod"

        if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag
        fi

        gh release create "$TAG" \
          --repo "${{ github.repository }}" \
          --target "$TARGET_SHA" \
          --title "$TITLE" \
          --notes-file RELEASE_NOTES_BILINGUAL.md \
          --latest \
          dist/Starward_0.18.0_fix_mod_x64.zip \
          dist/Starward_0.18.0_fix_mod_arm64.zip \
          RELEASE_NOTES_RU.md \
          RELEASE_NOTES_EN.md

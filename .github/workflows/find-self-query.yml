name: Update Self Query Parser

on:
  pull_request:
    branches: [ "main", "dev/*" ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: fix/localized-time-units-0.18.0
        fetch-depth: 2
    - name: Apply URL parser migration
      run: python .github/scripts/support_new_genshin_self_query_url.py
    - name: Commit parser update
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add src/Starward.Core/SelfQuery/SelfQueryClient.cs
        git commit -m "Support new Genshin account history URL"
        git push

name: Fix Pure Fiction Team Spacing

on:
  pull_request:
    branches: [ "main", "dev/*" ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: fix/localized-time-units-0.18.0
        fetch-depth: 2

    - name: Restore spacing between dates and characters
      shell: python
      run: |
        from pathlib import Path

        path = Path("src/Starward/Features/GameRecord/StarRail/PureFictionPage.xaml")
        text = path.read_text(encoding="utf-8-sig")

        replacements = {
            '<StackPanel Grid.Row="2" Grid.ColumnSpan="2" Margin="0,0,0,8" HorizontalAlignment="Center" Spacing="8"':
            '<StackPanel Grid.Row="2" Grid.ColumnSpan="2" Margin="0,8,0,8" HorizontalAlignment="Center" Spacing="8"',
            '<StackPanel Grid.Row="4" Grid.ColumnSpan="2" Margin="0,0,0,8" HorizontalAlignment="Center" Spacing="8"':
            '<StackPanel Grid.Row="4" Grid.ColumnSpan="2" Margin="0,8,0,8" HorizontalAlignment="Center" Spacing="8"',
            '<StackPanel Grid.Row="1" Grid.ColumnSpan="2" Margin="0,0,0,8" HorizontalAlignment="Center" Spacing="8">':
            '<StackPanel Grid.Row="1" Grid.ColumnSpan="2" Margin="0,8,0,8" HorizontalAlignment="Center" Spacing="8">',
        }

        for old, new in replacements.items():
            if text.count(old) != 1:
                raise RuntimeError(f"Expected exactly one match for: {old}")
            text = text.replace(old, new, 1)

        path.write_text(text, encoding="utf-8")

    - name: Commit XAML fix
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add src/Starward/Features/GameRecord/StarRail/PureFictionPage.xaml
        git commit -m "Restore Pure Fiction team date spacing"
        git push
